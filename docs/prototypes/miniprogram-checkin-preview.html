<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戒色打卡 · 小程序界面预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #eef1ef;
    color: #17211e;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 28px 20px 48px;
  }
  .head { max-width: 900px; margin: 0 auto 18px; text-align: center; }
  .head h1 { font-size: 20px; font-weight: 700; }
  .head p { margin-top: 6px; color: #68746f; font-size: 13px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px auto 22px; max-width: 760px; }
  .pill {
    border: 1px solid #c3d0cb; background: #fff; color: #17211e;
    border-radius: 999px; padding: 7px 16px; font-size: 13px; cursor: pointer;
  }
  .pill.on { background: #0f6e56; border-color: #0f6e56; color: #fff; font-weight: 600; }
  .stage { display: flex; justify-content: center; }
  .phone {
    width: 375px; height: 700px; background: #f4f7f5;
    border: 10px solid #1c1c1e; border-radius: 44px;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 30px 60px rgba(31, 52, 45, .22);
  }
  .navbar {
    flex: none; height: 44px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; color: #17211e;
    border-bottom: .5px solid #ececec;
  }
  .screen { flex: 1; overflow-y: auto; padding: 18px 14px 30px; }
  .homebar { flex: none; height: 22px; display: flex; align-items: center; justify-content: center; background: #f4f7f5; }
  .homebar i { width: 120px; height: 5px; border-radius: 3px; background: #1c1c1e; opacity: .85; }

  /* 以下尺寸/颜色逐条对应 checkin.wxss（rpx ÷ 2 = px） */
  .card { margin-bottom: 12px; padding: 15px; background: #fff; border: .5px solid #dce5e1; border-radius: 10px; box-shadow: 0 6px 18px rgba(31, 52, 45, .06); }
  .login-card { margin-top: 48px; }
  .eyebrow { color: #0f6e56; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
  .title { color: #17211e; font-size: 20px; font-weight: 700; line-height: 1.25; }
  .login-card .title { margin-top: 6px; }
  .subtitle { margin-top: 4px; color: #68746f; font-size: 13px; line-height: 1.5; }
  .label { margin: 17px 0 6px; color: #17211e; font-size: 13.5px; font-weight: 600; }
  .input, .textarea { width: 100%; border: .5px solid #c3d0cb; border-radius: 6px; background: #fbfdfc; color: #17211e; font-size: 14px; }
  .input { height: 44px; padding: 0 11px; display: flex; align-items: center; color: #93a09a; }
  .textarea { min-height: 95px; padding: 9px 11px; color: #17211e; }
  .textarea.ph { color: #93a09a; }
  button { border: 0; font: inherit; border-radius: 6px; cursor: default; }
  .primary { width: 100%; margin-top: 15px; padding: 13px; color: #fff; background: #0f6e56; font-size: 14px; }
  .primary.small { width: auto; margin-top: 0; flex: 1; padding: 10px; }
  .secondary { margin-top: 0; color: #0f6e56; background: #e1f5ee; flex: 1; padding: 10px; font-size: 14px; }
  .off { opacity: .5; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 14px; }
  .topbar .title { font-size: 19px; }
  .link-button { margin: 0; padding: 0 4px; color: #0f6e56; background: transparent; font-size: 12.5px; }
  .section-title { color: #17211e; font-size: 15.5px; font-weight: 700; }
  .optional { color: #68746f; font-size: 12px; font-weight: 400; }
  .hint { margin-top: 5px; color: #68746f; font-size: 12.5px; line-height: 1.55; }
  .select-button { width: 100%; margin-top: 12px; padding: 13px; color: #0f6e56; background: #e1f5ee; font-size: 14px; }
  .picked { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding: 9px; border: .5px solid #b6dcc7; border-radius: 6px; background: #f4fbf8; }
  .picked-main { min-width: 0; flex: 1; }
  .picked-name { overflow: hidden; color: #17211e; font-size: 13.5px; text-overflow: ellipsis; white-space: nowrap; }
  .picked-meta { margin-top: 2.5px; color: #68746f; font-size: 11px; }
  .remove-button { flex: none; margin: 0; padding: 0 6px; color: #a32d2d; background: transparent; font-size: 11.5px; }
  .counter { margin-top: 4px; color: #93a09a; text-align: right; font-size: 11px; }
  .notice { margin: 10px 0; padding: 10px; border-radius: 6px; font-size: 12.5px; line-height: 1.55; }
  .pending-notice { color: #07513f; background: #e1f5ee; }
  .error-notice { color: #8e2727; background: #fcebeb; }
  .success-notice { color: #07513f; background: #e1f5ee; }
  .confirm { border-color: #f0d8ad; background: #fffaf0; }
  .confirm-title { color: #8b5e00; font-size: 14.5px; font-weight: 700; }
  .confirm-actions { display: flex; gap: 9px; margin-top: 11px; }
  .footnote { padding: 12px 4px 0; color: #93a09a; text-align: center; font-size: 10.5px; }
</style>
</head>
<body>
  <div class="head">
    <h1>戒色打卡 · 小程序界面预览</h1>
    <p>按 <code>miniprogram/</code> 源码（WXML + WXSS）1:1 复刻的静态预览 · 数据为示例 · 点击上方按钮切换状态</p>
  </div>

  <div class="pills" id="pills"></div>

  <div class="stage">
    <div class="phone">
      <div class="navbar">戒色打卡</div>
      <div class="screen" id="screen"></div>
      <div class="homebar"><i></i></div>
    </div>
  </div>

<script>
const picked = (name, meta) => `
  <div class="picked">
    <div class="picked-main">
      <div class="picked-name">${name}</div>
      <div class="picked-meta">${meta}</div>
    </div>
    <button class="remove-button">移除</button>
  </div>`;

const form = (image, audio, reflection, notice, submitLabel, submitOff) => `
  <div class="topbar">
    <div>
      <div class="title">今日打卡</div>
      <div class="subtitle">榛佑 · 两项材料都传好才算成功</div>
    </div>
    <button class="link-button">退出</button>
  </div>
  <div class="card">
    <div class="section-title">1. 运动截图</div>
    <div class="hint">直接打开微信原生聊天选择器，每次只选择一张图片。</div>
    <button class="select-button">从聊天选择运动截图</button>
    ${image || ''}
  </div>
  <div class="card">
    <div class="section-title">2. 阅读录音</div>
    <div class="hint">从聊天中选择“作为文件发送”的 MP3、M4A、WAV 或 AAC；上限 100 MiB。</div>
    <button class="select-button">从聊天选择阅读录音</button>
    ${audio || ''}
  </div>
  <div class="card">
    <div class="section-title">3. 今日感悟 <span class="optional">选填</span></div>
    <div class="textarea ${reflection ? '' : 'ph'}">${reflection || '今天想对自己说的话……'}</div>
    <div class="counter">${(reflection || '').length} / 2000</div>
  </div>
  ${notice || ''}
  <button class="primary ${submitOff ? 'off' : ''}">${submitLabel}</button>
  <div class="footnote">上传链路：verify → prepare → readFile → COS PUT ×2 → finalize</div>`;

const IMG = picked('运动截图.png', 'image/png · 482,113 字节');
const AUD = picked('阅读录音.m4a', 'audio/mp4 · 12,582,912 字节');

const states = {
  login: `
    <div class="card login-card">
      <div class="eyebrow">JIESE CHECK-IN</div>
      <div class="title">戒色打卡</div>
      <div class="subtitle">从微信聊天直接选择今天的材料</div>
      <div class="label">昵称</div>
      <div class="input">2–16 位中文、字母或数字</div>
      <div class="label">邀请码</div>
      <div class="input">向管理员获取</div>
      <button class="primary">进入打卡</button>
    </div>`,
  form: form('', '', '', '', '提交打卡', true),
  uploaded: form(IMG, AUD, '今天读了戒色文章第 3 篇，坚持慢跑了 30 分钟。', `
    <div class="notice pending-notice">两份材料已上传。可继续填写感悟，点击“提交打卡”才会正式登记。</div>`, '提交打卡', false),
  resubmit: form(IMG, AUD, '今天读了戒色文章第 3 篇，坚持慢跑了 30 分钟。', `
    <div class="notice pending-notice">上一次登记没有收到结果。两份材料已经上传，点击“重交本次登记”会复用同一个 submission_id，不会重新申请媒体或再次上传。</div>`, '重交本次登记', false),
  duplicate: form(IMG, AUD, '今天读了戒色文章第 3 篇，坚持慢跑了 30 分钟。', `
    <div class="notice pending-notice">两份材料已上传。可继续填写感悟，点击“提交打卡”才会正式登记。</div>
    <div class="card confirm">
      <div class="confirm-title">重复日确认</div>
      <div class="hint">你今天已经打过卡了，确认要再登记一次吗？</div>
      <div class="confirm-actions">
        <button class="secondary">不再登记</button>
        <button class="primary small">确认再登记</button>
      </div>
    </div>`, '提交打卡', false),
  success: form('', '', '', `
    <div class="notice success-notice">打卡成功：截图、录音和感悟已登记。</div>`, '提交打卡', true),
};

const labels = {
  login: '登录页',
  form: '打卡页（待选材料）',
  uploaded: '材料已上传',
  resubmit: '重交本次登记',
  duplicate: '重复日确认',
  success: '打卡成功',
};

const pillsEl = document.getElementById('pills');
const screenEl = document.getElementById('screen');
let current = 'uploaded';

Object.keys(states).forEach((key) => {
  const b = document.createElement('button');
  b.className = 'pill' + (key === current ? ' on' : '');
  b.textContent = labels[key];
  b.dataset.key = key;
  b.onclick = () => {
    current = key;
    document.querySelectorAll('.pill').forEach((p) => p.classList.toggle('on', p.dataset.key === key));
    screenEl.innerHTML = states[key];
  };
  pillsEl.appendChild(b);
});
screenEl.innerHTML = states[current];
</script>
</body>
</html>
